<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F7F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1211" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sofar">
<title>{{.Title}} — Sofar</title>
<link rel="stylesheet" href="/static/app.css">
<script>
  try {
    var t = localStorage.getItem("sofar-theme");
    if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body class="lg">
<main class="lgb">
  <div class="br">Sofar<em>_</em></div>
  <form method="post" action="/login">
    <input class="v2" type="password" name="password" autocomplete="current-password"
           placeholder="Пароль" autofocus required aria-label="Пароль">
    <button type="submit" class="primary">Увійти</button>
  </form>
  {{if .Locked}}
  <p class="lge">Забагато спроб. Спробуй за чверть години.</p>
  {{else if .Failed}}
  <p class="lge">Не той пароль.</p>
  {{else}}
  <p class="lgh">Один пароль на весь сервіс. Далі рік нічого не питатиме.</p>
  {{end}}
</main>
</body>
</html>
